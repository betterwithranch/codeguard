name: codeguard test
description: Test the rules a rule package or a project's .codeguard/ defines, and optionally evaluate its judge rules.
inputs:
  claude-code-oauth-token:
    description: Claude subscription token the judge runs with, from `claude setup-token`. Needed for eval.
    required: false
  packages-token:
    description: GitHub token that can read the project's private rule packages.
    required: false
  logfire-token:
    description: Logfire write token. When set, codeguard sends a trace of each eval run, with each judge call's tokens, cost and duration.
    required: false
  eval:
    description: Also run `codeguard eval`, which calls Claude for each judge rule case. Needs claude-code-oauth-token.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.2.0
    - name: Authenticate rule package fetches
      if: inputs.packages-token != ''
      shell: bash
      run: git config --global url."https://x-access-token:${PACKAGES_TOKEN}@github.com/".insteadOf "https://github.com/"
      env:
        PACKAGES_TOKEN: ${{ inputs.packages-token }}
    - name: Test rules
      shell: bash
      run: uv run --frozen --project "${{ github.action_path }}/.." codeguard test
    - name: Install Claude Code
      if: inputs.eval == 'true'
      shell: bash
      run: npm install --global @anthropic-ai/claude-code
    - name: Evaluate judge rules
      if: inputs.eval == 'true'
      shell: bash
      run: uv run --frozen --project "${{ github.action_path }}/.." codeguard eval
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        LOGFIRE_TOKEN: ${{ inputs.logfire-token }}
