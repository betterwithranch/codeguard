[project]
name = "codeguard"
version = "0.1.0"
description = "Runs a project's own rules on its changed files, at agent Stop and in CI."
authors = [
    { name = "Craig Israel", email = "craig@theisraels.net" }
]
requires-python = ">=3.13"
dependencies = [
    "ast-grep-cli>=0.45.3",
    "diskcache>=5.6.3",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
codeguard = "codeguard.cli:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.importlinter]
root_packages = ["codeguard"]

[[tool.importlinter.contracts]]
name = "codeguard packages depend one way"
type = "layers"
containers = ["codeguard"]
exhaustive = true
layers = [
    "cli",
    "rules",
    "ast_grep | claude",
    "review | rule_tests",
    "config | working_tree",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "pytest-factoryboy>=2.8.1",
]
