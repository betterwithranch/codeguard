[project]
name = "codeguard"
version = "0.4.0"
description = "Runs a project's own rules on its changed files, at agent Stop and in CI."
authors = [
    { name = "Craig Israel", email = "craig@theisraels.net" }
]
requires-python = ">=3.13"
dependencies = [
    "ast-grep-cli>=0.45.3",
    "diskcache>=5.6.3",
    "google-genai>=2.28.0",
    "logfire>=5.2.0",
    "packaging>=26.3",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
codeguard = "codeguard.cli:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["evals/fixtures"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "SIM",
    "UP",
    "C4",
    "C90",
    "PGH003",
    "PLR0913",
    "PLR0915",
    "PLC0415",
    "T20",
    "TID251",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["codeguard.config.RulesetConfig"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.TYPE_CHECKING".msg = "Do not use TYPE_CHECKING. Fix the import cycle."

[tool.basedpyright]
include = ["src", "evals"]
exclude = ["evals/fixtures"]
typeCheckingMode = "standard"
reportExplicitAny = "error"
reportMissingTypeArgument = "error"
reportUnnecessaryIsInstance = "error"
reportUnnecessaryComparison = "error"

[tool.importlinter]
root_packages = ["codeguard"]

[[tool.importlinter.contracts]]
name = "codeguard packages depend one way"
type = "layers"
containers = ["codeguard"]
exhaustive = true
layers = [
    "cli",
    "rules",
    "claude_provider | gemini_provider | judge_evals",
    "pattern_rules",
    "rule_tests",
    "review | packages",
    "syntax",
    "ast_grep",
    "config | working_tree | file_lock",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "factory-boy>=3.3.3",
    "import-linter>=2.15",
    "pydantic-evals>=2.57.0",
    "pytest>=9.1.1",
    "pytest-factoryboy>=2.8.1",
    "ruff>=0.17.1",
]
