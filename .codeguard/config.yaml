packages:
  - kind: versioned
    git: https://github.com/betterwithranch/codeguard-rules.git
    version: ">=0.4,<1"
    rulesets:
      python:
        include:
          - all-only-in-init
          - no-append-in-every-branch
          - no-assert-in-fixtures
          - no-assert-on-lookup-field
          - no-bucket-module-names
          - no-comments-in-tests
          - no-constructed-test-constants
          - no-default-constructor-fixtures
          - no-del-param
          - no-dict-round-trip-between-models
          - no-field-tuple-asserts
          - no-len-asserts
          - no-manual-kwargs-check
          - no-normalized-asserts
          - no-pop-from-kwargs
          - no-sleep-in-async-tests
          - no-tuple-fixtures
          - typed-dispatch-registries
        rules:
          no-assert-on-lookup-field: &tests-only
            paths:
              - "**/test_*.py"
              - "**/*_test.py"
              - "**/tests/**/*.py"
              - "**/conftest.py"
          no-comments-in-tests: *tests-only
          no-constructed-test-constants: *tests-only
          no-default-constructor-fixtures: *tests-only
          no-field-tuple-asserts: *tests-only
          no-len-asserts: *tests-only
          no-manual-kwargs-check: *tests-only
          no-normalized-asserts: *tests-only
          no-pop-from-kwargs: *tests-only
          enum-usage: &not-in-tests
            exclude_paths:
              - "**/test_*.py"
              - "**/*_test.py"
              - "**/tests/**/*.py"
              - "**/conftest.py"
          no-append-in-every-branch: *not-in-tests
          no-bucket-module-names:
            exclude_paths: []
          no-dict-round-trip-between-models: *not-in-tests
          typed-dispatch-registries: *not-in-tests
