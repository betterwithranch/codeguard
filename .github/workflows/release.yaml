name: codeguard release
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: write
jobs:
  move-major-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the versions match the tag
        run: .github/scripts/check-versions.sh "${GITHUB_REF_NAME#v}"
      - name: Move the major tag to this release
        shell: bash
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag --force "$major" "$GITHUB_SHA"
          git push --force origin "$major"
