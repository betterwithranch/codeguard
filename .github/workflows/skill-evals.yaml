name: writing-rules skill evals
on:
  pull_request:
    paths: [skills/writing-rules/**, evals/writing-rules/**]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  skill-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm install --global @anthropic-ai/claude-code
      - run: claude plugin eval . --scaffold --allow-tools Write Edit --runs 3 --threshold 0.8 --trust-plugin --no-publish
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
