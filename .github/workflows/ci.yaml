name: codeguard CI
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv run --frozen ruff check
      - run: uv run --frozen ruff format --check
      - run: uv run --frozen pytest
      - run: uv run --frozen lint-imports
      - run: uv run --frozen basedpyright
  codeguard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./
        with:
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          logfire-token: ${{ secrets.LOGFIRE_TOKEN }}
          dry-run: true
  judge-evals:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [claude-haiku-5-5, claude-sonnet-5-5]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: npm install --global @anthropic-ai/claude-code
      - run: uv run --frozen codeguard test evals/judge
      - run: uv run --frozen codeguard eval evals/judge
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEGUARD_CONFIG: ${{ github.workspace }}/evals/models/${{ matrix.model }}.yaml
