name: codeguard CI
on:
  push:
    branches: [main]
    paths-ignore: &docs [docs/**, README.md, CLAUDE.md]
  pull_request:
    paths-ignore: *docs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: .github/scripts/check-versions.sh
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv run --frozen ruff check
      - run: uv run --frozen ruff format --check
      - run: uv run --frozen pytest
      - run: uv run --frozen lint-imports
      - run: uv run --frozen basedpyright
  codeguard-rules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./
        with:
          logfire-token: ${{ secrets.LOGFIRE_TOKEN }}
          dry-run: true
  llm-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # Workload Identity Federation: no key is stored. The project comes from the service
      # account.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: astral-sh/setup-uv@v10.2.0
      # Each worker makes 2 Gemini calls at once, which keeps the run under Vertex's
      # tokens-per-minute limit.
      - run: uv run --frozen pytest -m llm -n 4
