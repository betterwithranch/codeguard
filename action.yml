name: codeguard
description: Check a pull request's changed files against the project's rules, and run the rule tests.
inputs:
  base:
    description: Ref the changes are compared against. The checkout needs its history (fetch-depth 0).
    default: origin/${{ github.base_ref }}
  claude-code-oauth-token:
    description: Claude subscription token the judge runs with, from `claude setup-token`. Needed when a binding uses a skill.
    required: false
  packages-token:
    description: GitHub token that can read the project's private rule packages.
    required: false
  logfire-token:
    description: Logfire write token. When set, codeguard sends a trace of each run, with each judge call's tokens, cost and duration.
    required: false
  eval:
    description: Also run `codeguard eval`, which calls Claude for each judge rule case. Needs claude-code-oauth-token.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.2.0
    - name: Authenticate rule package fetches
      if: inputs.packages-token != ''
      shell: bash
      run: git config --global url."https://x-access-token:${PACKAGES_TOKEN}@github.com/".insteadOf "https://github.com/"
      env:
        PACKAGES_TOKEN: ${{ inputs.packages-token }}
    - name: Install Claude Code
      shell: bash
      run: npm install --global @anthropic-ai/claude-code
    - name: Check changed files
      id: review
      shell: bash
      run: uv run --frozen --project "${{ github.action_path }}" codeguard review --latest --base "${{ inputs.base }}"
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        LOGFIRE_TOKEN: ${{ inputs.logfire-token }}
    - name: Point to the plugin
      if: failure() && steps.review.outcome == 'failure'
      shell: bash
      run: echo "::error::Install the codeguard plugin so your agent catches these before you push. See https://github.com/betterwithranch/codeguard#setup"
    - name: Test rules
      shell: bash
      run: uv run --frozen --project "${{ github.action_path }}" codeguard test
    - name: Evaluate judge rules
      if: inputs.eval == 'true'
      shell: bash
      run: uv run --frozen --project "${{ github.action_path }}" codeguard eval
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        LOGFIRE_TOKEN: ${{ inputs.logfire-token }}
